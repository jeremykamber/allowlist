<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Access Blocked — AllowList</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<style>
		:root {
			--bg: #fafbfc;
			--panel: #ffffff;
			--fg: #1a2332;
			--muted: #738394;
			--accent: #3b82f6;
			--accent-hover: #2563eb;
			--accent-light: #eff6ff;
			--danger: #ef4444;
			--border: #e5e7eb;
			--shadow: 0 4px 12px 0 rgba(0, 0, 0, 0.08);
			--radius: 12px;
			--transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
		}

		[data-theme="dark"] {
			--bg: #0f172a;
			--panel: #1e293b;
			--fg: #e2e8f0;
			--muted: #94a3b8;
			--accent: #60a5fa;
			--accent-hover: #3b82f6;
			--accent-light: #1e293b;
			--border: #334155;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0; padding: 0;
			background: linear-gradient(135deg, var(--bg) 0%, #f0f4f8 100%);
			font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Ubuntu, sans-serif;
			color: var(--fg);
			min-height: 100vh;
			display: flex; align-items: center; justify-content: center;
			-webkit-font-smoothing: antialiased;
		}

		.container {
			max-width: 540px; width: 90%;
			background: var(--panel);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: 48px 32px;
			box-shadow: var(--shadow);
			text-align: center;
			animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
		}

		@keyframes slideUp {
			from { opacity: 0; transform: translateY(20px); }
			to { opacity: 1; transform: translateY(0); }
		}

		.icon { font-size: 64px; margin-bottom: 16px; display: block; }
		h1 { margin: 0 0 8px; font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
		.subtitle { color: var(--muted); font-size: 15px; margin: 0 0 24px; line-height: 1.6; font-weight: 500; }

		.stats {
			background: linear-gradient(135deg, var(--accent-light) 0%, #dbeafe 100%);
			border: 1px solid rgba(59, 130, 246, 0.3);
			border-radius: 10px; padding: 16px; margin-bottom: 24px;
			display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
		}

		.stat { text-align: center; }
		.stat-value { font-size: 24px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
		.stat-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }

		.quote-block {
			background: linear-gradient(135deg, #fef3c7 0%, #fef9e7 100%);
			border: 1px solid rgba(245, 158, 11, 0.3);
			border-left: 3px solid #f59e0b;
			border-radius: 8px; padding: 16px; margin-bottom: 24px;
			animation: slideIn 0.5s ease-out 0.2s both;
		}

		[data-theme="dark"] .quote-block {
			background: linear-gradient(135deg, #422006 0%, #292524 100%);
			border-color: rgba(245, 158, 11, 0.2);
		}

		@keyframes slideIn {
			from { opacity: 0; transform: translateX(-12px); }
			to { opacity: 1; transform: translateX(0); }
		}

		.quote-text { font-size: 15px; font-weight: 600; line-height: 1.6; margin-bottom: 8px; }
		.quote-author { font-size: 12px; color: var(--muted); font-weight: 500; }

		.breathing { display: none; align-items: center; justify-content: center; gap: 12px; margin-bottom: 24px; }
		.breathing-circle {
			width: 60px; height: 60px;
			border: 3px solid var(--accent); border-radius: 50%;
			animation: breathing 4s infinite;
		}
		@keyframes breathing {
			0%, 100% { transform: scale(1); opacity: 0.3; }
			50% { transform: scale(1.3); opacity: 0.1; }
		}
		.breathing-text { font-size: 12px; color: var(--muted); font-weight: 600; }

		.cta-section { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); }
		.cta-text { font-size: 13px; color: var(--muted); margin-bottom: 12px; }

		.site-name {
			font-family: "SF Mono", Monaco, "Cascadia Code", Roboto Mono, monospace;
			background: var(--bg); padding: 6px 10px; border-radius: 4px;
			color: var(--accent); font-weight: 600; font-size: 12px;
			display: inline-block; margin: 8px 0;
		}

		.btn {
			display: inline-block; padding: 12px 20px;
			background: var(--accent); border: none; border-radius: 8px;
			color: white; font-weight: 600; font-size: 13px;
			cursor: pointer; transition: var(--transition);
			font-family: inherit;
		}
		.btn:hover {
			background: var(--accent-hover);
			box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
			transform: translateY(-2px);
		}
		.btn:active { transform: translateY(0); }
		.btn-secondary {
			display: block; margin: 8px auto 0;
			background: transparent; color: var(--accent);
			border: 1px solid var(--accent); box-shadow: none;
		}
		.btn-secondary:hover { background: var(--accent-light); box-shadow: none; }

		.list-badge {
			display: inline-block;
			background: var(--accent-light); color: var(--accent);
			padding: 4px 10px; border-radius: 12px;
			font-size: 11px; font-weight: 600; margin-bottom: 16px;
		}

		.temp-allow-msg {
			display: none; margin-top: 12px;
			color: #10b981; font-weight: 600; font-size: 14px;
			animation: fadeIn 0.3s ease;
		}
		@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

		.tip { font-size: 12px; color: var(--muted); margin-top: 16px; line-height: 1.6; }
	</style>
</head>
<body>
	<div class="container">
		<span class="icon">🎯</span>
		<h1>Stay Focused</h1>
		<p class="subtitle">This site is blocked while you're focusing.</p>
		<div class="list-badge" id="current-list-name">AllowList</div>

		<div class="stats">
			<div class="stat">
				<div class="stat-value" id="focus-time">—</div>
				<div class="stat-label">Time Focused</div>
			</div>
			<div class="stat">
				<div class="stat-value" id="blocked-count">—</div>
				<div class="stat-label">Blocked Today</div>
			</div>
		</div>

		<div class="quote-block">
			<div class="quote-text" id="quote">Stay focused on what matters</div>
			<div class="quote-author" id="quote-author">—</div>
		</div>

		<div class="breathing" id="breathing">
			<div class="breathing-circle"></div>
			<div class="breathing-text">Take a deep breath</div>
		</div>

		<div class="cta-section">
			<p class="cta-text">Trying to access:</p>
			<div class="site-name" id="blocked-site-text">example.com</div>

			<div style="margin-top: 16px; display: flex; flex-direction: column; gap: 8px;">
				<button class="btn" id="temp-allow-5m">🔓 Temporarily Allow</button>
				<div class="temp-allow-msg" id="temp-allow-msg"></div>
			</div>

			<div class="tip">
				<strong>Tip:</strong> Press <kbd>Cmd+Shift+L</kbd> to add any site to your allowlist.
			</div>
		</div>
	</div>

	<script src="blocked.js"></script>
</body>
</html>
