<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Blocked — AllowList</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* ═══════════════════════════════════════════════════════════════════════
       AllowList — Blocked Page Styles
       Matches popup design system for brand consistency.
       ═══════════════════════════════════════════════════════════════════════ */

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-light: #eff6ff;
      --accent-subtle: #dbeafe;
      --accent-glow: rgba(37, 99, 235, 0.2);
      --success: #059669;
      --success-light: #d1fae5;
      --warning: #d97706;
      --warning-light: #fef3c7;
      --danger: #dc2626;
      --danger-light: #fee2e2;
      --fg: #0f172a;
      --fg-secondary: #475569;
      --fg-tertiary: #64748b;
      --bg: #f8fafc;
      --panel: #ffffff;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.12);
      --radius: 12px;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      --font-mono: 'SF Mono', 'Monaco', 'Cascadia Code', 'Roboto Mono', monospace;
    }

    [data-theme="dark"] {
      --accent: #60a5fa;
      --accent-hover: #3b82f6;
      --accent-light: #1e3a5f;
      --accent-subtle: #1e3a5f;
      --accent-glow: rgba(96, 165, 250, 0.2);
      --fg: #f8fafc;
      --fg-secondary: #cbd5e1;
      --fg-tertiary: #94a3b8;
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.5);
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      padding: 24px;
    }

    .card {
      max-width: 480px;
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 32px;
      box-shadow: var(--shadow-md);
      text-align: center;
      animation: slideUp 0.4s var(--ease);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .icon {
      font-size: 56px;
      margin-bottom: 12px;
      display: block;
      animation: float 3s var(--ease) infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--fg);
    }

    .subtitle {
      color: var(--fg-secondary);
      font-size: 14px;
      margin: 0 0 6px;
      line-height: 1.6;
    }

    .list-badge {
      display: inline-block;
      background: var(--accent-light);
      color: var(--accent);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: 0.02em;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 20px;
    }

    .stat {
      background: var(--accent-light);
      border: 1px solid var(--accent-subtle);
      border-radius: 10px;
      padding: 14px 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 2px;
      letter-spacing: -0.02em;
    }

    .stat-label {
      font-size: 10px;
      color: var(--fg-secondary);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .quote-block {
      background: linear-gradient(135deg, #fef3c7 0%, #fffbeb 100%);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-left: 3px solid var(--warning);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
      animation: slideIn 0.5s var(--ease) 0.15s both;
    }

    [data-theme="dark"] .quote-block {
      background: linear-gradient(135deg, #422006 0%, #292524 100%);
      border-color: rgba(245, 158, 11, 0.15);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-8px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .quote-text {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.6;
      color: var(--fg);
      margin-bottom: 6px;
    }

    .quote-author {
      font-size: 12px;
      color: var(--fg-tertiary);
      font-weight: 500;
    }

    .breathing {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
      animation: fadeIn 0.5s var(--ease);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .breathing-circle {
      width: 48px;
      height: 48px;
      border: 3px solid var(--accent);
      border-radius: 50%;
      animation: breathe 4s var(--ease) infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.35); opacity: 0.08; }
    }

    .breathing-text {
      font-size: 12px;
      color: var(--fg-tertiary);
      font-weight: 600;
    }

    .footer-section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .footer-label {
      font-size: 12px;
      color: var(--fg-tertiary);
      margin-bottom: 8px;
    }

    .site-name {
      font-family: var(--font-mono);
      background: var(--bg);
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      color: var(--accent);
      font-weight: 600;
      font-size: 12px;
      display: inline-block;
      margin-bottom: 16px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 20px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s var(--ease);
      font-family: inherit;
      width: 100%;
    }

    .btn:hover {
      background: var(--accent-hover);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .success-msg {
      display: none;
      margin-top: 8px;
      color: var(--success);
      font-weight: 600;
      font-size: 14px;
      animation: fadeIn 0.3s var(--ease);
    }

    .tip {
      font-size: 12px;
      color: var(--fg-tertiary);
      margin-top: 16px;
      line-height: 1.6;
    }

    .tip kbd {
      display: inline-block;
      padding: 1px 5px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: var(--font);
      font-size: 11px;
      font-weight: 600;
      color: var(--fg-secondary);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .card { animation: none !important; }
      .icon { animation: none !important; }
      .quote-block { animation: none !important; }
      .breathing { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">🎯</span>
    <h1>Stay Focused</h1>
    <p class="subtitle">This site is blocked by</p>
    <div class="list-badge" id="current-list-name">AllowList</div>

    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="focus-time">—</div>
        <div class="stat-label">Time Focused</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="blocked-count">—</div>
        <div class="stat-label">Blocked Today</div>
      </div>
    </div>

    <div class="quote-block">
      <div class="quote-text" id="quote">Stay focused on what matters</div>
      <div class="quote-author" id="quote-author">—</div>
    </div>

    <div class="breathing" id="breathing">
      <div class="breathing-circle"></div>
      <span class="breathing-text">Take a deep breath</span>
    </div>

    <div class="footer-section">
      <div class="footer-label">Trying to access</div>
      <div class="site-name" id="blocked-site-text">example.com</div>

      <button class="btn" id="temp-allow-btn">
        🔓 Temporarily Allow
      </button>
      <div class="success-msg" id="temp-allow-msg"></div>

      <div class="tip">
        <strong>Tip:</strong> Press <kbd>Cmd+Shift+L</kbd> to add a site
      </div>
    </div>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
